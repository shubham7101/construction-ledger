function login(){return `<div class="p-6 flex flex-col justify-center min-h-screen gap-6">

 return `${header()}<div class="px-4 space-y-4 pt-2">

<div class="space-y-3">${list.map(p=>`<button onclick="S.pid=${p.id};S.scope=S.site;go('ledger')" class="w-full text-left ${card} p-4 flex items-center gap-3">

function ledger(){

 const g=tx.filter(x=>x.t==='gave').reduce((a,x)=>a+x.a,0),r=tx.filter(x=>x.t==='got').reduce((a,x)=>a+x.a,0),n=g-r;

const MO={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};

const hasD=f=>f.dm!=='any'&&(dstr(f.d1)||dstr(f.d2));
const nAct=f=>(hasT(f)?1:0)+(hasD(f)?1:0);

const fsum=f=>{const p=[];if(hasT(f))p.push(f.t);const a=dstr(f.d1),b=dstr(f.d2);if(f.dm==='day'&&a)p.push(a);if(f.dm==='range'&&(a||b))p.push(`${a||'…'} → ${b||'…'}`);return p.length?` · ${p.join(' · ')}`:''};

function fsetV(){const k=S.fk;if(!k)return'';const f=F[k];
