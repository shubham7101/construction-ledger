<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f59e0b" />
    <title>Offline · Construction Ledger</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 28px 22px;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
      }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.25rem; margin: 14px 0 6px; }
      p { color: #475569; font-size: 0.9rem; line-height: 1.45; margin: 0 0 18px; }
      button {
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: #f59e0b;
        color: #0f172a;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>
        Construction Ledger needs a connection to load your ledgers. Nothing
        you saved is lost — reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
